version: 2
updates:
  # npm (frontend) -- revisa semanalmente si hay actualizaciones, en
  # especial de seguridad, para las dependencias de package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Agrupa las actualizaciones menores/de parche en un solo PR para no
      # inundar de PRs individuales -- las de versión mayor sí quedan
      # separadas, porque esas conviene revisarlas una por una.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions -- mismo cuidado para el propio workflow de CI
  # (.github/workflows/ci.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
